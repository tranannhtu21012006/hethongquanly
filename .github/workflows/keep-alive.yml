name: Supabase Keep-Alive

# Ping Supabase every 3 days to prevent Free Plan from pausing the project
# Supabase pauses free projects after 7 days of inactivity

on:
  schedule:
    # Runs at 00:00 UTC every 3 days (Mon, Thu, Sun)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "🏓 Pinging Supabase to keep project alive..."
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/shop_config?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Keep-alive ping successful! HTTP $RESPONSE"
          else
            echo "⚠️ Keep-alive ping returned HTTP $RESPONSE"
            exit 1
          fi
